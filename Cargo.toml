[workspace]
resolver = "2"
members = ["crates/snake-core", "crates/snake-render", "crates/snake-kindle", "crates/snake-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
snake-core = { path = "crates/snake-core" }
snake-render = { path = "crates/snake-render" }
primitive-app = { path = "../doannt-kindle-tools/crates/primitive-app" }
primitive-ui = { path = "../doannt-kindle-tools/crates/primitive-ui" }

[profile.release]
lto = true
codegen-units = 1
